# .platform-kb/kb-manifest.yaml
# Knowledge Base manifest for sandbox content crawling.
# Schema: platform-kb.trimble.com/v1alpha1 (ServiceKnowledgeManifest)

apiVersion: platform-kb.trimble.com/v1alpha1
kind: ServiceKnowledgeManifest

service:
  id: kb-sandbox-sample-docs
  display_name: "KB Sandbox Sample Docs"
  owner_team: "platform-kb"
  contact:
    slack: "#platform-kb"
    email: "platform-kb@trimble.com"
  lifecycle:
    status: alpha

versioning:
  strategy: semver
  config:
    semver:
      pattern: "v?(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)(?:-(?P<prerelease>[a-zA-Z0-9.]+))?"
      prerelease_indicators: [alpha, beta, rc, preview]
      stable_branches: [main, master]
  refs:
    production:
      type: branch
      selector: main
    staging:
      type: branch
      selector: main

documentation:
  generator: mkdocs
  root: "docs/"
  version_management:
    enabled: false
    tool: null
  paths:
    openapi:
      path: "openapi/openapi.yaml"
      required: false
      versioned: false
    getting_started:
      path: "getting-started.md"
      required: false
      versioned: false
    changelog:
      path: "CHANGELOG.md"
      required: false
      versioned: false
    content:
      pattern: "**/*.md"
      discovery: glob
      required: true
      versioned: false
      exclude:
        - "**/node_modules/**"
        - "**/.venv/**"
        - "**/site/**"
  exclude_patterns:
    - "**/node_modules/**"
    - "**/.venv/**"
    - "**/__pycache__/**"
    - "**/build/**"
    - "**/site/**"
    - "**/dist/**"
    - "**/.DS_Store"

sync:
  triggers:
    - type: on_manifest_change
      action: validate_and_sync
    - type: workflow_dispatch
  workflow:
    service_repo:
      validation:
        schema: true
        paths_exist: true
        openapi_valid: false
        links_valid: false
      ci_check:
        required: false

service_info:
  status: alpha
  tier: 3
  github_repo: "https://github.com/Sakthi1305ganesh/kb-sandbox-sample-docs"
  depends_on:
    services: []
    infrastructure: []

manifest:
  last_updated: "2026-08-12T00:00:00Z"
  updated_by: Sakthi1305ganesh
